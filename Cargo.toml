[workspace]
resolver = "2"
members = ["crates/protocol", "crates/host"]
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
espcap-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serialport = { version = "4", default-features = false }
regex = "1"
log = "0.4"
env_logger = "0.11"
